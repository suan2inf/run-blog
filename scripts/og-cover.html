<!doctype html>
<!--
  OG 分享卡片源文件（1200×630）。链接发到微信/QQ/Twitter 时显示的封面图。
  重新生成：用 Edge 无头截本地文件即可（在项目根目录执行）——
  & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new `
    --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=public/og-cover.png `
    "file:///绝对路径/scripts/og-cover.html"
  头像读的是 ../public/avatar.webp；字体用系统自带的微软雅黑，换机器生成时注意字体差异。
  配色和网站一致：近白底 + 墨蓝强调色。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Microsoft YaHei UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #fcfcfb;
    color: #16181c;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 104px;
  }
  /* 左侧一条墨蓝色竖边，卡片在聊天列表里缩成小图时也能认出来 */
  body::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 14px;
    background: #2c5d8f;
  }
  img {
    width: 248px;
    height: 248px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px #e6e6e3;
  }
  h1 {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: 0.01em;
    line-height: 1.2;
  }
  .tagline {
    margin-top: 26px;
    font-size: 30px;
    line-height: 1.7;
    color: #74777d;
  }
  .url {
    margin-top: 40px;
    font-size: 24px;
    color: #2c5d8f;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <img src="../public/avatar.webp" alt="">
  <div>
    <h1>算不尽的博客</h1>
    <p class="tagline">迎着风，迎向远方的天空<br>路上也有艰难，也有那解脱，都走得从容</p>
    <p class="url">suan2inf.github.io/run-blog</p>
  </div>
</body>
</html>
